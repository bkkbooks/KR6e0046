  - {type: variant, offset: 1782, length: 215, content: '八大菩薩讚出《八大菩薩曼茶羅經》末

      圓寂宮城門，能摧戶扇者，

      諸佛法受用，救世我頂禮。

      自手流清水，能除餓鬼渴，

      三界如意樹，頂禮蓮花手。

      大慈水為心，能息瞋恚火，

      頂禮慈氏尊，能斷欲弓弦。

      虛空藏妙慧，虛空寂靜尊，

      生死流解脫，頂禮佛心子。

      無邊有情惑，能息無益心，

      普賢我頂禮，善逝上首子。

      塵勞盡僮僕，超勝魔羅軍，

      頂禮金剛手，能說一切明。

      頂禮妙吉祥，持妙童子形，

      舒遍智慧燈，攘奪三界明。

      一切除蓋障，是故我頂禮，

      無盡智慧尊，能生無竭辯。

      如地諸有情，所依一不斷，

      堅慧悲愍藏，地藏我頂禮。

      此真善逝子，讚揚所獲福，

      以此諸有情，如彼成讚器。', 宋: '', 元: '', 明: ''}
